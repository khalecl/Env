<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Quiz Bros 🍄</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Fredoka', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #5c94fc 0%, #9fd0ff 60%, #c8f5e1 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* ☁️ CSS-only clouds — GPU-friendly transform animation */
  .cloud {
    position: fixed;
    font-size: 3rem;
    opacity: 0.85;
    animation: drift linear infinite;
    pointer-events: none;
    will-change: transform;
  }
  @keyframes drift {
    from { transform: translateX(-15vw); }
    to { transform: translateX(115vw); }
  }

  /* 🧱 Brick ground — two repeating gradients fake the brick mortar lines */
  .ground {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 34px;
    background:
      repeating-linear-gradient(0deg, transparent 0 14px, rgba(0,0,0,0.35) 14px 17px),
      repeating-linear-gradient(90deg, #c84c0c 0 30px, #8f3208 30px 33px);
    border-top: 5px solid #5e2004;
    pointer-events: none;
  }

  /* 🟢 Warp pipe — ::before forms the rim */
  .pipe {
    position: fixed;
    bottom: 34px;
    width: 58px;
    background: linear-gradient(90deg, #1c6b28 0%, #7fe08a 25%, #43d14f 55%, #1c6b28 100%);
    border: 3px solid #14511e;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    pointer-events: none;
  }
  .pipe::before {
    content: '';
    position: absolute;
    top: -16px; left: -9px; right: -9px;
    height: 14px;
    background: inherit;
    border: 3px solid #14511e;
    border-radius: 6px;
  }

  /* ⛰️ Background hill */
  .hill {
    position: fixed;
    bottom: 34px;
    width: 90px; height: 45px;
    background: #43d14f;
    border: 3px solid #2a9d3a;
    border-bottom: none;
    border-radius: 90px 90px 0 0;
    pointer-events: none;
  }

  /* ❓ Floating question block */
  .qblock {
    position: fixed;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 1rem;
    color: #6b4a00;
    background: linear-gradient(180deg, #ffd23e, #ffb52e);
    border: 3px solid #b8860b;
    border-radius: 8px;
    box-shadow: 0 4px 0 #8a6508;
    animation: bobble 2.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes bobble {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .card {
    position: relative;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 2rem;
    border: 5px solid #7c5cbf;
    box-shadow: 0 12px 0 rgba(0,0,0,0.15);
    padding: 2rem;
    width: 100%;
    max-width: 560px;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { transform: scale(0.7) translateY(40px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  h1 { font-family: 'Press Start 2P', monospace; color: #e52521; font-size: 1.25rem; line-height: 1.5; text-shadow: 3px 3px 0 #ffd23e; }
  .subtitle { color: #7c5cbf; margin: 0.5rem 0 1rem; }

  .hud {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    color: #7c5cbf;
    margin-bottom: 0.75rem;
    font-size: 0.95rem;
  }

  .coin-counter { color: #d4a017; }

  .progress-track {
    height: 14px;
    background: #e8ddf7;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 1.25rem;
    border: 2px solid #c9a0f5;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #43d14f, #a8f0a0);
    transition: width 0.4s ease;
  }

  .question {
    font-size: 1.2rem;
    font-weight: 600;
    color: #3d2b5a;
    margin-bottom: 1.25rem;
    min-height: 3.2rem;
  }

  .answers { display: grid; gap: 0.7rem; }

  /* 🧱 Question-block style buttons */
  .answer-btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.9rem 1.2rem;
    border: 3px solid #d4a017;
    border-radius: 1rem;
    background:
      radial-gradient(circle at 9px 9px, #b8860b 3px, transparent 4px),
      radial-gradient(circle at calc(100% - 9px) 9px, #b8860b 3px, transparent 4px),
      radial-gradient(circle at 9px calc(100% - 9px), #b8860b 3px, transparent 4px),
      radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), #b8860b 3px, transparent 4px),
      linear-gradient(180deg, #ffd23e, #ffb52e);
    color: #6b4a00;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 4px 0 #b8860b;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    will-change: transform;
  }
  .answer-btn:hover:not(:disabled) { transform: scale(1.05) rotate(-0.5deg); }
  .answer-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #b8860b; }
  .answer-btn:disabled { cursor: default; }

  .answer-btn.correct {
    background: linear-gradient(180deg, #7fe08a, #43d14f);
    border-color: #2a9d3a;
    color: #0d5c1a;
    animation: bounce 0.5s;
  }
  .answer-btn.wrong {
    background: linear-gradient(180deg, #ff9a8a, #e55252);
    border-color: #b03030;
    color: #fff;
    animation: shake 0.4s;
  }

  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.08) translateY(-8px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .feedback { margin-top: 1rem; font-weight: 700; font-size: 1.1rem; min-height: 1.6rem; }
  .feedback.good { color: #2a9d3a; }
  .feedback.bad { color: #d43a3a; }

  .why-box {
    margin-top: 0.9rem;
    text-align: left;
    background: #fff8e1;
    border: 3px solid #d4a017;
    border-radius: 1rem;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    line-height: 1.45;
    color: #5a4300;
  }

  .big-btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 0.9rem 2.2rem;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, #ff6b5e, #e52521);
    color: #fff;
    cursor: pointer;
    margin-top: 1.25rem;
    box-shadow: 0 5px 0 #a01515;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .big-btn:hover { transform: scale(1.05); }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #a01515; }

  /* 🪙 Flying coin — pure CSS transform, removed from DOM after animation */
  .coin {
    position: fixed;
    font-size: 2rem;
    pointer-events: none;
    z-index: 50;
    animation: coinFly 0.8s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes coinFly {
    0% { transform: translateY(0) scale(1) rotateY(0); opacity: 1; }
    100% { transform: translateY(-140px) scale(1.6) rotateY(720deg); opacity: 0; }
  }

  .mario-buddy {
    font-size: 3rem;
    display: inline-block;
    animation: idle 1.2s ease-in-out infinite;
  }
  @keyframes idle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* 🏃 Running hero — outer div moves across screen, inner span bounces */
  .runner {
    position: fixed;
    bottom: 38px;
    left: 0;
    font-size: 2.6rem;
    z-index: 2;
    pointer-events: none;
    animation: runAcross 14s linear infinite;
    will-change: transform;
  }
  .runner span {
    display: inline-block;
    animation: runJump 14s linear infinite; /* synced with runAcross so he clears each pipe */
  }
  @keyframes runAcross {
    from { transform: translateX(-10vw); }
    to { transform: translateX(110vw); }
  }
  /* Jumps timed to pipe positions (5%, 22%, 40%, 58%, 76%, 90% across the screen) */
  @keyframes runJump {
    0%, 9% { transform: translateY(0); }
    12% { transform: translateY(-85px); }
    15%, 23% { transform: translateY(0); }
    26.5% { transform: translateY(-70px); }
    30%, 38% { transform: translateY(0); }
    41.5% { transform: translateY(-100px); }
    45%, 53% { transform: translateY(0); }
    56.5% { transform: translateY(-70px); }
    60%, 68% { transform: translateY(0); }
    71.5% { transform: translateY(-95px); }
    75%, 80% { transform: translateY(0); }
    83% { transform: translateY(-65px); }
    86%, 100% { transform: translateY(0); }
  }
  /* 🍄 Pixel-art Mario — one div, box-shadow draws each pixel */
  .pixel-mario {
    width: 4px;
    height: 4px;
    position: relative;
    top: -64px; /* lift sprite above ground line */
    box-shadow:
      /* row 0-2: red hat */
      20px 0 0 #e52521, 24px 0 0 #e52521, 28px 0 0 #e52521, 32px 0 0 #e52521, 36px 0 0 #e52521,
      16px 4px 0 #e52521, 20px 4px 0 #e52521, 24px 4px 0 #e52521, 28px 4px 0 #e52521, 32px 4px 0 #e52521, 36px 4px 0 #e52521, 40px 4px 0 #e52521, 44px 4px 0 #e52521, 48px 4px 0 #e52521,
      /* row 3: hair + face */
      16px 8px 0 #6b3a12, 20px 8px 0 #6b3a12, 24px 8px 0 #6b3a12, 28px 8px 0 #ffcc99, 32px 8px 0 #ffcc99, 36px 8px 0 #000, 40px 8px 0 #ffcc99,
      /* row 4: face */
      12px 12px 0 #6b3a12, 16px 12px 0 #ffcc99, 20px 12px 0 #6b3a12, 24px 12px 0 #ffcc99, 28px 12px 0 #ffcc99, 32px 12px 0 #ffcc99, 36px 12px 0 #000, 40px 12px 0 #ffcc99, 44px 12px 0 #ffcc99, 48px 12px 0 #ffcc99,
      /* row 5: mustache */
      12px 16px 0 #6b3a12, 16px 16px 0 #6b3a12, 20px 16px 0 #ffcc99, 24px 16px 0 #ffcc99, 28px 16px 0 #ffcc99, 32px 16px 0 #ffcc99, 36px 16px 0 #6b3a12, 40px 16px 0 #6b3a12, 44px 16px 0 #6b3a12, 48px 16px 0 #6b3a12,
      /* row 6: chin */
      16px 20px 0 #ffcc99, 20px 20px 0 #ffcc99, 24px 20px 0 #ffcc99, 28px 20px 0 #ffcc99, 32px 20px 0 #ffcc99, 36px 20px 0 #ffcc99, 40px 20px 0 #ffcc99,
      /* row 7-8: shirt + overalls */
      16px 24px 0 #e52521, 20px 24px 0 #e52521, 24px 24px 0 #2a5bd7, 28px 24px 0 #e52521, 32px 24px 0 #e52521, 36px 24px 0 #2a5bd7, 40px 24px 0 #e52521, 44px 24px 0 #e52521,
      12px 28px 0 #e52521, 16px 28px 0 #e52521, 20px 28px 0 #e52521, 24px 28px 0 #2a5bd7, 28px 28px 0 #2a5bd7, 32px 28px 0 #2a5bd7, 36px 28px 0 #2a5bd7, 40px 28px 0 #e52521, 44px 28px 0 #e52521, 48px 28px 0 #e52521,
      /* row 9: arms + overalls with buttons */
      12px 32px 0 #ffcc99, 16px 32px 0 #e52521, 20px 32px 0 #2a5bd7, 24px 32px 0 #ffd23e, 28px 32px 0 #2a5bd7, 32px 32px 0 #2a5bd7, 36px 32px 0 #ffd23e, 40px 32px 0 #2a5bd7, 44px 32px 0 #e52521, 48px 32px 0 #ffcc99,
      /* row 10-11: legs */
      16px 36px 0 #2a5bd7, 20px 36px 0 #2a5bd7, 24px 36px 0 #2a5bd7, 28px 36px 0 #2a5bd7, 32px 36px 0 #2a5bd7, 36px 36px 0 #2a5bd7, 40px 36px 0 #2a5bd7, 44px 36px 0 #2a5bd7,
      16px 40px 0 #2a5bd7, 20px 40px 0 #2a5bd7, 24px 40px 0 #2a5bd7, 36px 40px 0 #2a5bd7, 40px 40px 0 #2a5bd7, 44px 40px 0 #2a5bd7,
      /* row 12: shoes */
      12px 44px 0 #6b3a12, 16px 44px 0 #6b3a12, 20px 44px 0 #6b3a12, 24px 44px 0 #6b3a12, 36px 44px 0 #6b3a12, 40px 44px 0 #6b3a12, 44px 44px 0 #6b3a12, 48px 44px 0 #6b3a12;
  }

  /* 👾 Enemies walking the other way */
  .enemy {
    position: fixed;
    bottom: 38px;
    left: 0;
    font-size: 1.9rem;
    z-index: 1;
    pointer-events: none;
    animation: walkLeft linear infinite;
    will-change: transform;
  }
  @keyframes walkLeft {
    from { transform: translateX(110vw) scaleX(-1); }
    to { transform: translateX(-12vw) scaleX(-1); }
  }

  /* 🪙 Spinning background coins */
  .spin-coin {
    position: fixed;
    font-size: 1.5rem;
    pointer-events: none;
    animation: coinSpin 1.4s linear infinite;
    will-change: transform;
  }
  @keyframes coinSpin {
    from { transform: rotateY(0); }
    to { transform: rotateY(360deg); }
  }
  /* 🎵 Music toggle button */
  .music-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 100;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 0.5rem 1rem;
    border: 3px solid #b8860b;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffd23e, #ffb52e);
    color: #6b4a00;
    cursor: pointer;
    box-shadow: 0 3px 0 #8a6508;
    transition: transform 0.15s;
  }
  .music-btn:hover { transform: scale(1.08); }
  .music-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6508; }

  .result-emoji { font-size: 4rem; }
  .result-score { font-size: 2.4rem; font-weight: 700; color: #e52521; text-shadow: 2px 2px 0 #ffd23e; }

  .breakdown {
    text-align: left;
    margin-top: 1.25rem;
    max-height: 240px;
    overflow-y: auto;
    display: grid;
    gap: 0.5rem;
  }
  .breakdown-item {
    background: #f4effc;
    border-radius: 0.9rem;
    padding: 0.7rem 1rem;
    font-size: 0.88rem;
    color: #4a3a6b;
    border-left: 6px solid #43d14f;
  }
  .breakdown-item.missed { border-left-color: #e55252; }
  .breakdown-item .your-answer { color: #9a8ab8; font-size: 0.78rem; }

  /* 📱 Mobile: keep the scenery, but shrink & tuck it behind the card */

</style>
</head>
<body>

<!-- Decorative clouds: 3 elements, infinite CSS animation, zero JS cost -->
<div class="cloud" style="top:8%; animation-duration:38s;">☁️</div>
<div class="cloud" style="top:20%; animation-duration:55s; animation-delay:-20s;">☁️</div>
<div class="cloud" style="top:4%; animation-duration:70s; animation-delay:-45s;">☁️</div>
<div class="ground"></div>
<!-- 🍄 Scenery: pipes, hills, floating ?-blocks (pure CSS, zero JS) -->
<div class="pipe" style="left:5%; height:70px;"></div>
<div class="pipe" style="left:22%; height:55px;"></div>
<div class="pipe" style="left:40%; height:90px;"></div>
<div class="pipe" style="left:58%; height:60px;"></div>
<div class="pipe" style="left:76%; height:85px;"></div>
<div class="pipe" style="left:90%; height:50px;"></div>
<div class="hill" style="left:20%;"></div>
<div class="hill" style="right:24%; width:130px; height:65px;"></div>
<div class="qblock" style="left:13%; top:26%;">?</div>
<div class="qblock" style="right:13%; top:18%; animation-delay:-1.1s;">?</div>
<!-- 🏃 Animated characters: running hero, walking enemies, spinning coins -->
<div class="runner"><span class="pixel-mario"></span></div>
<div class="enemy" style="animation-duration:19s;">🐢</div>
<div class="enemy" style="animation-duration:26s; animation-delay:-9s;">👻</div>
<div class="enemy" style="animation-duration:33s; animation-delay:-20s; font-size:1.5rem;">🦆</div>
<div class="spin-coin" style="left:30%; top:14%;">🪙</div>
<div class="spin-coin" style="left:70%; top:30%; animation-delay:-0.5s;">🪙</div>
<div class="spin-coin" style="left:48%; top:8%; animation-delay:-0.9s;">🪙</div>
<button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 Music: OFF</button>

<div class="card" id="app"></div>

<script>
/* ============================================================
   🔊 SOUND ENGINE — Web Audio API, zero audio files.
   Context created lazily on first click (browser autoplay policy).
   ============================================================ */
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function beep(freq, start, dur, type = 'square', vol = 0.12) {
  const ctx = ac();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, ctx.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + dur);
}

const SFX = {
  coin()   { beep(988, 0, 0.08); beep(1319, 0.08, 0.35); },                       // classic coin ding
  wrong()  { beep(220, 0, 0.15, 'sawtooth'); beep(165, 0.15, 0.3, 'sawtooth'); }, // sad slide down
  jump()   { beep(300, 0, 0.1, 'square'); beep(600, 0.08, 0.12); },               // boing
  start()  { [523, 659, 784].forEach((f, i) => beep(f, i * 0.09, 0.12)); },       // power-up arpeggio
  fanfare(){ [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, i * 0.12, 0.18)); }, // level clear!
  gameover(){ [392, 370, 349, 330].forEach((f, i) => beep(f, i * 0.18, 0.22, 'triangle')); }
};
/* ============================================================
   🎵 BACKGROUND MUSIC — looping overworld melody, Web Audio only.
   Starts on first user interaction (autoplay policy).
   ============================================================ */
const MELODY = [ // [note, beats] — 0 = rest — actual SMB overworld theme
  [659,.5],[659,.5],[0,.5],[659,.5],[0,.5],[523,.5],[659,.5],[0,.5],
  [784,1],[0,1],[392,1],[0,1],
  [523,.75],[0,.25],[392,.5],[0,.5],[330,.5],[0,.5],
  [440,.5],[494,.5],[0,.25],[466,.25],[440,.5],
  [392,.75],[659,.75],[784,.75],[880,.5],[698,.5],[784,.5],
  [0,.25],[659,.5],[523,.5],[587,.5],[494,.75],[0,.75],
  [523,.75],[0,.25],[392,.5],[0,.5],[330,.5],[0,.5],
  [440,.5],[494,.5],[0,.25],[466,.25],[440,.5],
  [392,.75],[659,.75],[784,.75],[880,.5],[698,.5],[784,.5],
  [0,.25],[659,.5],[523,.5],[587,.5],[494,.75],[0,.75],
  // second half: bridge
  [659,.75],[523,.75],[392,.5],[0,.5],[415,.5],
  [440,.5],[698,.5],[698,.5],[440,.5],[0,.5],
  [494,.75],[880,.75],[880,.75],[880,.75],[784,.75],[698,.75],
  [659,.75],[523,.75],[440,.5],[392,.5],[0,1],
  [659,.75],[523,.75],[392,.5],[0,.5],[415,.5],
  [440,.5],[698,.5],[698,.5],[440,.5],[0,.5],
  [494,.75],[698,.75],[698,.75],[698,.75],[659,.75],[587,.75],
  [523,.75],[392,.75],[330,.5],[262,.5],[0,1],
  // ending riff
  [523,.5],[392,.5],[330,.5],[440,.5],[494,.5],[440,.5],
  [415,.5],[466,.5],[415,.5],[392,.5],[370,.5],[392,.5],[0,.5]
];
const BASS = [ // simple bassline, one note per bar-ish
  [294,1],[294,1],[0,1],[294,1],[0,1],[294,1],[294,1],[0,1],
  [392,1],[0,1],[196,2],
  [262,1.5],[196,1],[165,1.5],[220,1],[247,1],[233,.5],[220,1],
  [165,.75],[262,.75],[330,.75],[440,1],[349,.5],[392,1],[330,1],[262,.5],[294,.5],[247,1.5],
  // bass for second half
  [262,1],[196,1],[208,1],[220,1],[175,1],[220,1],
  [247,1],[392,1],[392,1],[262,1],[196,1],
  [262,1],[196,1],[208,1],[220,1],[175,1],[220,1],
  [247,1],[349,1],[349,1],[262,1],[196,1],[262,1],
  [262,1],[165,1],[220,1],[175,1],[208,1],[196,1],[262,1]
];
const BEAT = 0.32; // slower tempo — full melody plays at a relaxed pace
let musicOn = false;

function playLoop() {
  if (!musicOn) return;
  let t = 0;
  MELODY.forEach(([f, b]) => {
    if (f) beep(f, t, BEAT * b * 0.9, 'square', 0.045);
    t += BEAT * b;
  });
  let bt = 0;
  BASS.forEach(([f, b]) => {
    if (f) beep(f, bt, BEAT * b * 0.9, 'triangle', 0.06);
    bt += BEAT * b;
  });
  setTimeout(playLoop, Math.max(t, bt) * 1000);
}

function startMusic() {
  if (musicOn) return;
  musicOn = true;
  playLoop();
}
function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (musicOn) {
    musicOn = false; // playLoop checks this and stops scheduling
    btn.textContent = '🎵 Music: OFF';
  } else {
    ac(); // ensure context exists (user gesture)
    startMusic();
    btn.textContent = '🎵 Music: ON';
  }
}

/* ============================================================
   📝 QUESTIONS
   ============================================================ */
const QUESTIONS = [
  { q: "A patient on clozapine develops fever, myalgia, and a WBC of 900/µL. The most likely diagnosis is:", answers: ["Neuroleptic malignant syndrome", "Agranulocytosis", "Serotonin syndrome", "Tardive dyskinesia"], correct: 1, why: "Clozapine's most dangerous adverse effect is agranulocytosis (WBC < 500–1000/µL), which is why mandatory blood monitoring exists. NMS also causes fever but with rigidity and elevated CK, not a collapsed WBC." },
  { q: "Which finding best differentiates delirium from dementia?", answers: ["Impaired short-term memory", "Acute onset with fluctuating attention", "Aphasia and apraxia", "Insidious progression over years"], correct: 1, why: "Delirium = acute onset (hours–days), fluctuating course, and impaired attention/awareness. Dementia is insidious and progressive with attention preserved until late. Memory impairment occurs in both, so it doesn't discriminate." },
  { q: "A patient has euphoria, decreased need for sleep, and pressured speech for 4 days with no functional impairment or psychosis. This is:", answers: ["Manic episode", "Hypomanic episode", "Cyclothymic disorder", "Substance-induced mood disorder"], correct: 1, why: "Hypomania = ≥4 days of elevated/expansive mood WITHOUT marked functional impairment, psychosis, or hospitalization. Mania requires ≥7 days (or hospitalization) WITH marked impairment." },
  { q: "Blocking D2 receptors in the tuberoinfundibular pathway most directly causes:", answers: ["Akathesia", "Hyperprolactinemia", "Tardive dyskinesia", "Orthostatic hypotension"], correct: 1, why: "Dopamine normally inhibits prolactin release from the pituitary via the tuberoinfundibular pathway. Blocking D2 there removes the brake → hyperprolactinemia (galactorrhea, amenorrhea, sexual dysfunction)." },
  { q: "A patient recounts trauma in a flat, detached monotone without any emotional response. This is an example of:", answers: ["Dissociative amnesia", "Isolation of affect", "Blunted affect as a negative symptom", "Alexithymia"], correct: 1, why: "Isolation of affect is a defense mechanism where the traumatic event is recalled but stripped of its emotional charge. Alexithymia is inability to identify/describe feelings; blunted affect is a negative symptom of schizophrenia." },
  { q: "Which EEG finding is classically associated with Creutzfeldt-Jakob disease?", answers: ["Triphasic waves", "Periodic sharp wave complexes", "3 Hz spike-and-wave", "Hypsarrhythmia"], correct: 1, why: "CJD classically shows periodic (1–2 Hz) sharp wave complexes on EEG. Triphasic waves → hepatic encephalopathy; 3 Hz spike-and-wave → absence seizures; hypsarrhythmia → infantile spasms (West syndrome)." },
  { q: "In Clark's cognitive model of panic disorder, panic attacks are maintained primarily by:", answers: ["Conditioned avoidance of places", "Catastrophic misinterpretation of bodily sensations", "Repressed conflict over anger", "Interoceptive hyposensitivity"], correct: 1, why: "Clark's model: benign bodily sensations (e.g., palpitations) are catastrophically misinterpreted ('I'm having a heart attack'), which increases anxiety, which intensifies sensations — a vicious cycle." },
  { q: "A patient believes their organs are rotting and that they are already dead. This delusion is characteristic of:", answers: ["Capgras syndrome", "Cotard syndrome", "Fregoli delusion", "Ekbom syndrome"], correct: 1, why: "Cotard syndrome = nihilistic delusions of being dead, rotting, or not existing. Capgras = loved one replaced by an impostor; Fregoli = different people are one person in disguise; Ekbom = delusion of insect infestation." },
  { q: "Which is the strongest single predictor of completed suicide?", answers: ["Major depressive disorder", "A previous suicide attempt", "Male sex", "Access to lethal means"], correct: 1, why: "A prior suicide attempt is the single strongest predictor of future completed suicide — stronger than any diagnosis, demographic, or access factor." },
  { q: "Lithium toxicity is most potentiated by concurrent use of:", answers: ["SSRIs", "Thiazide diuretics and NSAIDs", "Beta-blockers", "Benzodiazepines"], correct: 1, why: "Thiazides and NSAIDs reduce renal lithium clearance (thiazides increase proximal Na/Li reabsorption; NSAIDs reduce renal blood flow via prostaglandin inhibition), raising lithium levels toward toxicity." },
  { q: "A child consistently violates others' rights, is cruel to animals, and sets fires. Before diagnosing conduct disorder, the clinician must rule out:", answers: ["ADHD", "Nothing — these behaviors meet criteria if persistent", "Oppositional defiant disorder only", "Intermittent explosive disorder"], correct: 1, why: "Cruelty to animals, fire-setting, and persistent violation of others' rights are core conduct disorder criteria. If the pattern is persistent (≥3 criteria over 12 months), the diagnosis stands on its own." },
  { q: "The 'jumping to conclusions' bias in psychosis is most reliably measured by:", answers: ["The Stroop task", "The beads (urn) task", "The Wisconsin Card Sort", "The Iowa Gambling Task"], correct: 1, why: "In the beads task, participants guess which of two jars (with opposite bead ratios) a drawn bead came from. Patients with delusions decide after very few beads — demonstrating the jumping-to-conclusions bias." },
  { q: "Which antidepressant carries the highest risk of hypertensive crisis with tyramine-rich foods?", answers: ["Venlafaxine", "Phenelzine", "Bupropion", "Mirtazapine"], correct: 1, why: "Phenelzine is an irreversible, non-selective MAOI. Tyramine (aged cheese, cured meats) displaces norepinephrine from vesicles; with MAO blocked it can't be degraded → hypertensive crisis." },
  { q: "In line with the 'vascular depression' hypothesis, late-onset depression is most associated with:", answers: ["Hippocampal hypertrophy", "White matter hyperintensities on MRI", "Reduced amygdala volume", "Enlarged ventricles only"], correct: 1, why: "The vascular depression hypothesis links late-onset depression to cerebrovascular disease, visible as white matter hyperintensities (small-vessel ischemic changes) disrupting frontostriatal mood circuits." },
  { q: "A patient with panic disorder is started on an SSRI. The most important initial counseling point is:", answers: ["Take only during panic attacks", "Anxiety may transiently worsen in the first 1–2 weeks", "Avoid all caffeine permanently", "Expect full response within 48 hours"], correct: 1, why: "SSRIs commonly cause a transient increase in anxiety/jitteriness in the first 1–2 weeks before therapeutic benefit (4–6 weeks). Warning patients prevents premature discontinuation; 'start low, go slow' helps." },
  { q: "Which symptom is NOT part of the DSM-5 criteria for PTSD?", answers: ["Intrusive memories", "Persistent negative alterations in cognition and mood", "Hallucinations", "Marked alterations in arousal and reactivity"], correct: 2, why: "DSM-5 PTSD clusters: intrusion, avoidance, negative alterations in cognition/mood, and arousal/reactivity. Hallucinations are NOT a criterion — their presence suggests another diagnosis (e.g., psychotic disorder)." },
  { q: "The 'expressed emotion' research of Brown and Vaughn showed that high EE predicts relapse most strongly in patients who:", answers: ["Take medication irregularly", "Spend more than 35 hours/week in face-to-face contact with high-EE relatives", "Live alone", "Have predominantly negative symptoms"], correct: 1, why: "Brown & Vaughn found relapse risk from high expressed emotion (criticism, hostility, over-involvement) was greatest when patients spent >35 hours/week in face-to-face contact with high-EE relatives." },
  { q: "A patient cannot recognize familiar faces but can identify people by voice. This deficit is:", answers: ["Prosopagnosia", "Capgras syndrome", "Visual agnosia with preserved audition", "Anosognosia"], correct: 0, why: "Prosopagnosia = selective inability to recognize faces (fusiform face area damage), with recognition via voice/gait preserved. Capgras is a delusion that a familiar person is an impostor — recognition occurs but familiarity feels wrong." },
  { q: "Which psychotherapy has the strongest evidence base for chronic PTSD in military veterans per VA/DoD guidelines?", answers: ["Psychodynamic therapy", "Prolonged exposure and cognitive processing therapy", "Supportive counseling", "Hypnotherapy"], correct: 1, why: "VA/DoD guidelines give the strongest recommendation to trauma-focused therapies: Prolonged Exposure (PE) and Cognitive Processing Therapy (CPT), both with large RCT evidence in veteran populations." },
  { q: "Wernicke encephalopathy classically presents with which triad?", answers: ["Fever, rigidity, autonomic instability", "Encephalopathy, ophthalmoplegia, ataxia", "Amnesia, confabulation, apathy", "Tremor, hallucinations, seizures"], correct: 1, why: "Wernicke (thiamine deficiency, often in alcohol use disorder) = encephalopathy/confusion + ophthalmoplegia (nystagmus, lateral gaze palsy) + gait ataxia. Amnesia + confabulation describes Korsakoff syndrome, its chronic sequela." },
  { q: "In behavioral activation for depression, the core mechanism of change is hypothesized to be:", answers: ["Cognitive restructuring of core beliefs", "Increased contact with positive reinforcement", "Cathartic emotional expression", "Extinction of avoidance via imaginal exposure"], correct: 1, why: "Behavioral activation schedules rewarding, value-consistent activities to increase contact with positive reinforcement, breaking the withdrawal–inactivity–low-mood cycle — without targeting cognitions directly." },
  { q: "A patient with schizophrenia hears a voice commenting on their actions in the third person. Per Schneider, this is:", answers: ["A second-rank symptom", "A first-rank symptom", "A negative symptom", "A dissociative symptom"], correct: 1, why: "Third-person running-commentary hallucinations are a Schneiderian first-rank symptom, along with voices conversing, thought insertion/withdrawal/broadcast, and delusional perception." },
  { q: "Which lab abnormality is most characteristic of anorexia nervosa with purging?", answers: ["Hyperkalemia", "Hypokalemic hypochloremic metabolic alkalosis", "Metabolic acidosis", "Hypernatremia"], correct: 1, why: "Self-induced vomiting loses H⁺ and Cl⁻ → hypochloremic metabolic alkalosis; volume depletion triggers aldosterone → renal K⁺ wasting → hypokalemia. This pattern is a red flag for purging." },
  { q: "The 'hopelessness theory' of depression (Abramson, Metalsky & Alloy) centers on:", answers: ["Global, stable attributions plus negative inferred consequences", "Low self-esteem alone", "Learned helplessness in childhood", "Serotonin transporter polymorphisms"], correct: 0, why: "Hopelessness theory: depression arises when negative events are attributed to stable + global causes AND are inferred to have catastrophic consequences and imply personal worthlessness — producing hopelessness." },
  { q: "Abrupt discontinuation of which antidepressant most commonly causes 'brain zaps' and severe discontinuation syndrome?", answers: ["Fluoxetine", "Venlafaxine or paroxetine", "Bupropion", "Mirtazapine"], correct: 1, why: "Short half-life serotonergic agents (venlafaxine, paroxetine) cause the worst discontinuation syndromes — dizziness, 'brain zaps', irritability. Fluoxetine's long half-life (norfluoxetine) makes it the mildest." }
];

const PRAISE = ["Wahoo! 🍄", "It's-a correct! ⭐", "Mamma mia, nice! 🎉", "Coin collected! 🪙", "1-UP! 💚"];
const ROASTS = [
  "Oof. A Goomba could've answered that. 💀",
  "You fell in a pit. It happens. 🕳️",
  "Wrong pipe, buddy. 🔧",
  "Bowser is laughing at you right now. 🐢",
  "That answer got fireballed. 🔥"
];

const app = document.getElementById('app');
let current = 0, score = 0, results = [];

function renderStart() {
  app.innerHTML = `
    <div class="mario-buddy">🍄</div>
    <h1>SUPER QUIZ BROS</h1>
    <p class="subtitle">25 hard clinical psychology questions stand between you and the flagpole.<br>
    Collect coins. Avoid pits. Don't let Bowser win.</p>
    <button class="big-btn" onclick="startQuiz()">▶ START GAME</button>
  `;
}

function startQuiz() {
  startMusic();
  document.getElementById('musicBtn').textContent = '🎵 Music: ON';
  SFX.start();
  current = 0; score = 0; results = [];
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  app.innerHTML = `
    <div class="hud">
      <span>WORLD 1-${current + 1}</span>
      <span class="coin-counter">🪙 × ${String(score).padStart(2, '0')}</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${(current / QUESTIONS.length) * 100}%"></div>
    </div>
    <div class="question">${q.q}</div>
    <div class="answers">
      ${q.answers.map((a, i) => `<button class="answer-btn" onclick="answer(${i}, this)">❓ ${a}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
  `;
}

function spawnCoin(x, y) {
  const c = document.createElement('div');
  c.className = 'coin';
  c.textContent = '🪙';
  c.style.left = x + 'px';
  c.style.top = y + 'px';
  document.body.appendChild(c);
  c.addEventListener('animationend', () => c.remove()); // no DOM leaks
}

function answer(i, btn) {
  const q = QUESTIONS[current];
  const buttons = document.querySelectorAll('.answer-btn');
  const feedback = document.getElementById('feedback');
  buttons.forEach(b => b.disabled = true);

  const isCorrect = i === q.correct;
  buttons[q.correct].classList.add('correct');

  if (isCorrect) {
    score++;
    SFX.coin();
    const r = btn.getBoundingClientRect();
    spawnCoin(r.left + r.width / 2, r.top);
    feedback.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    feedback.className = 'feedback good';
  } else {
    SFX.wrong();
    buttons[i].classList.add('wrong');
    feedback.textContent = `The correct answer was: ${q.answers[q.correct]}`;
    feedback.className = 'feedback bad';
  }

  results.push({ question: q.q, picked: q.answers[i], correctAnswer: q.answers[q.correct], isCorrect });

  // 📖 Explanation step — replaces the MCQ answers, user reads then continues
  const isLast = current === QUESTIONS.length - 1;
  document.querySelector('.answers').innerHTML = `
    <div class="why-box">💡 <strong>Why:</strong> ${q.why}</div>
    <button class="big-btn" onclick="nextQuestion()">${isLast ? '🏁 SEE RESULTS' : '▶ NEXT QUESTION'}</button>
  `;
}

function nextQuestion() {
  SFX.jump();
  current++;
  current < QUESTIONS.length ? renderQuestion() : renderResults();
}

function renderResults() {
  const perfect = score === QUESTIONS.length;
  const emoji = perfect ? '🏆' : score >= 7 ? '⭐' : score >= 4 ? '🍄' : '💀';
  const message = perfect ? "LEVEL CLEAR! You saved the princess!" :
                  score >= 7 ? "So close! The princess is in THIS castle!" :
                  score >= 4 ? "Not bad, but Bowser escaped..." :
                  "GAME OVER. The Goombas send their regards.";

  perfect || score >= 7 ? SFX.fanfare() : SFX.gameover();

  app.innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <h1>${message}</h1>
    <div class="result-score">🪙 ${score} / ${QUESTIONS.length}</div>
    <p class="subtitle">${Math.round((score / QUESTIONS.length) * 100)}% — ${perfect ? "PERFECT RUN!" : "insert coin to continue"}</p>
    <div class="breakdown">
      ${results.map(r => `
        <div class="breakdown-item ${r.isCorrect ? '' : 'missed'}">
          ${r.isCorrect ? '🪙' : '💀'} ${r.question}
          ${r.isCorrect ? '' : `<div class="your-answer">You: ${r.picked} · Answer: ${r.correctAnswer}</div>`}
        </div>`).join('')}
    </div>
    <button class="big-btn" onclick="startQuiz()">🔄 CONTINUE?</button>
  `;

  if (perfect) {
    const colors = ['#e52521', '#ffd23e', '#43d14f', '#5c94fc'];
    confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors });
    setTimeout(() => confetti({ particleCount: 100, angle: 60, spread: 80, origin: { x: 0 }, colors }), 300);
    setTimeout(() => confetti({ particleCount: 100, angle: 120, spread: 80, origin: { x: 1 }, colors }), 600);
  }
}

renderStart();
</script>
</body>
</html>
